name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked toolchain
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
          locked: true

      - name: Check Mojo formatting
        run: |
          pixi run format
          git diff --exit-code -- src/crypto tests conda.recipe/test.mojo

      - name: Run tests
        run: pixi run --environment test test

      - name: Precompile and test package
        run: pixi run --environment test test-consumer
