name: Publish package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-14
            platform: osx-arm64
    env:
      PREFIX_CHANNEL: ${{ vars.PREFIX_CHANNEL }}
      PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          recipe_version="$(rg -m 1 '^  version:' conda.recipe/recipe.yaml | sed -n 's/^  version: "\([^"]*\)"/\1/p')"
          test -n "$recipe_version"
          test "${RELEASE_TAG#v}" = "$recipe_version"

      - name: Check publishing configuration
        run: |
          test -n "$PREFIX_CHANNEL"
          test -n "$PREFIX_API_KEY"

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          artifact-name: crypto-${{ matrix.platform }}
          build-args: >-
            --recipe conda.recipe/recipe.yaml
            -c conda-forge
            -c https://conda.modular.com/max

      - name: Upload package to prefix.dev
        run: |
          shopt -s globstar nullglob
          packages=(output/**/*.conda)
          test "${#packages[@]}" -gt 0
          rattler-build upload prefix --channel "$PREFIX_CHANNEL" "${packages[@]}"
